<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>分发台 · 抖音发布助手</title><link rel="stylesheet" href="console.css"><script src="console.js" defer></script></head><body>
<main><p class="eyebrow">分发台 · 抖音单条真实试验</p><h1>核对本条任务，再上传</h1><p>助手使用刚才点开扩展的抖音标签页。请保留助手窗口，视频上传和填写完成后，到操作台总览确认最终提交。</p>
<section id="connect-panel"><h2>接收本机任务</h2><div class="row"><label>本机端口<input id="port" type="number" min="1024" max="65535" value="48637"></label><label class="grow">本次任务码<input id="code" type="password" autocomplete="off" spellcheck="false" maxlength="32"></label></div><button id="connect">接收并显示本条配置</button></section>
<section id="job-panel" hidden><h2>本条发布配置</h2><div id="job-summary"></div><label>你已在抖音页面核对的实际账号<input id="account" maxlength="120" placeholder="填写账号昵称与抖音号，用于本条核对"></label><label class="check"><input id="account-confirm" type="checkbox">我已核对当前抖音标签页的账号与本条素材</label><div class="row"><button id="prepare">确认上传视频并填写</button><button id="stop" class="quiet">停止本次助手</button></div><p class="note">上传会把所选视频与封面送到抖音。声明、合集或标签没核对齐时，会停止在需人工处理；不会省略后发布。最终提交仍等待操作台确认。</p></section>
<section><h2>当前状态</h2><p id="status" role="status" aria-live="polite">等待接收任务。没有上传或发布。</p><pre id="log" aria-label="本次步骤记录"></pre></section>
<section id="result-panel" hidden><h2>核对平台结果</h2><p>提交许可已经使用，不能重复点击发布。请在平台作品记录中核对结果，并粘贴对应作品链接。</p><label>已核对的抖音作品链接<input id="work-url" placeholder="https://www.douyin.com/video/…"></label><label>平台当前状态<input id="platform-status" maxlength="100" placeholder="例如：审核中 / 已发布"></label><div class="row"><button id="record-result">登记这条平台记录</button><button id="record-unknown" class="quiet">暂不能判断，记为待核查</button></div></section>
<p class="note">不读取 Cookie、密码或页面存储，不设置定位。只处理这条任务；关闭或停止后请核对平台已有草稿，助手不会自动删除或重发。</p></main></body></html>
